name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      api: ${{ steps.filter.outputs.api }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/shared/**'
            api:
              - 'apps/api/**'
              - 'packages/shared/**'
            infra:
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'docker-compose.prod.yml'
              - 'apps/web/Dockerfile'
              - 'apps/api/Dockerfile'
              - '.github/workflows/**'

  ci-web:
    name: CI Web
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build web
        run: pnpm --filter @amosmind/web build
      - name: Lint web
        run: pnpm --filter @amosmind/web lint

  ci-api:
    name: CI API
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prisma generate
        run: pnpm --filter @amosmind/api exec prisma generate
      - name: Build api
        run: pnpm --filter @amosmind/api build

  ci-infra:
    name: CI Infra
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker compose config
        run: docker compose -f docker-compose.prod.yml --env-file deploy/.env.prod.example config --quiet

  build-api:
    name: Build API image
    needs: [changes, ci-api]
    if: |
      github.event_name == 'push' &&
      (needs.changes.outputs.api == 'true' || needs.changes.outputs.infra == 'true') &&
      needs.ci-api.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/nathan-f11/amosmind-api:${{ github.sha }}
            ghcr.io/nathan-f11/amosmind-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-web:
    name: Build Web image
    needs: [changes, ci-web]
    if: |
      github.event_name == 'push' &&
      (needs.changes.outputs.web == 'true' || needs.changes.outputs.infra == 'true') &&
      needs.ci-web.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve NEXT_PUBLIC_API_URL
        id: web_url
        run: |
          if [ -n "${{ vars.NEXT_PUBLIC_API_URL }}" ]; then
            echo "url=${{ vars.NEXT_PUBLIC_API_URL }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ secrets.DEPLOY_PUBLIC_IP }}" ]; then
            echo "url=http://${{ secrets.DEPLOY_PUBLIC_IP }}/api" >> "$GITHUB_OUTPUT"
          else
            echo "url=http://localhost/api" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ steps.web_url.outputs.url }}
          tags: |
            ghcr.io/nathan-f11/amosmind-web:${{ github.sha }}
            ghcr.io/nathan-f11/amosmind-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
