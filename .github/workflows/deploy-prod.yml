name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      services:
        description: '部署服务 (all | web | api | web,api)'
        required: true
        default: all
        type: choice
        options:
          - all
          - web
          - api
          - web,api
      git_ref:
        description: '部署的 Git 引用 (默认 origin/main；回滚填旧 commit SHA)'
        required: false
        default: origin/main
        type: string
      run_migrate:
        description: '执行 prisma migrate deploy'
        required: true
        default: false
        type: boolean

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          command_timeout: 90m
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            export GIT_REF="${{ inputs.git_ref }}"
            export PUBLIC_IP="${{ secrets.DEPLOY_PUBLIC_IP }}"
            bash deploy/deploy-remote.sh "${{ inputs.services }}" "${{ inputs.run_migrate }}"
