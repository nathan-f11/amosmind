services:
  postgres:
    image: postgres:16-alpine
    container_name: amosmind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: amosmind
    volumes:
      - amosmind_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 384M

  redis:
    image: redis:7-alpine
    container_name: amosmind-redis
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 128M

  minio:
    image: minio/minio:latest
    container_name: amosmind-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - amosmind_minio:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: amosmind-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/amosmind?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN}
      ASSET_PUBLIC_BASE_URL: ${ASSET_PUBLIC_BASE_URL}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-amos-assets}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_PUBLIC_READ: ${S3_PUBLIC_READ:-true}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-mock}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_API_URL: ${MODEL_API_URL:-https://api.siliconflow.cn/v1}
      MODEL_TEXT2IMG: ${MODEL_TEXT2IMG:-Qwen/Qwen-Image}
      GENERATION_COST: ${GENERATION_COST:-10}
      SEED_EMAIL: ${SEED_EMAIL:-dev@amosmind.local}
      SEED_PASSWORD: ${SEED_PASSWORD}
      SEED_CREDITS: ${SEED_CREDITS:-98775}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: amosmind-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
    depends_on:
      - api
    deploy:
      resources:
        limits:
          memory: 512M

  nginx:
    image: nginx:1.27-alpine
    container_name: amosmind-nginx
    restart: unless-stopped
    ports:
      - '80:80'
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api
    deploy:
      resources:
        limits:
          memory: 64M

volumes:
  amosmind_pg:
  amosmind_minio:
